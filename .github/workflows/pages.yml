name: Deploy GitHub Pages

on:
  push:
    branches: [main, master, unico]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        env:
          # Domínio próprio (plataform.balloon.app.br) usa raiz, não /repo/
          VITE_BASE: /
          VITE_API_BASE_URL: https://api.balloon.app.br/api/v1
          VITE_ADMIN_URL: https://console.balloon.app.br
          # Public key é pública por design. NUNCA coloque MERCADOPAGO_ACCESS_TOKEN aqui.
          VITE_MERCADOPAGO_PUBLIC_KEY: ${{ secrets.VITE_MERCADOPAGO_PUBLIC_KEY }}
        run: npm run build:prod
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
